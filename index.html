<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mszana-INFO – Przerwa techniczna</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f4f8;
            color: #333;
            text-align: center;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
            padding: 48px 40px;
            max-width: 520px;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 1.6rem; margin: 0 0 12px; }
        p  { font-size: 1.05rem; line-height: 1.6; color: #555; }
        .badge {
            display: inline-block;
            margin-top: 24px;
            padding: 6px 16px;
            border-radius: 20px;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: .9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔧</div>
        <h1>Przerwa techniczna</h1>
        <p>
            Szanowni Mieszkańcy,<br>
            strona <strong>mszana.info</strong> jest tymczasowo niedostępna
            ze względu na prace techniczne.<br>
            Prosimy o wyrozumiałość – wrócimy jak najszybciej.
        </p>
        <span class="badge">Wkrótce wracamy</span>
    </div>
</body>
</html>
